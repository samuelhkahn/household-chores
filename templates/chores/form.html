{% extends "base.html" %}
{% block title %}{{ title }} · Household Chores{% endblock %}
{% block content %}
<section>
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a class="button secondary" href="{% url 'chores:home' %}">Cancel</a>
  </form>
</section>
{% endblock %}
