{% extends "base.html" %}
{% block title %}Sign in · Household Chores{% endblock %}
{% block content %}
<section>
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
